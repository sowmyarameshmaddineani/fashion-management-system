<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOGUE | Fashion Store</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 800; letter-spacing: 2px; color: #ff3f6c !important; }
        .product-card { border: none; transition: transform 0.2s, box-shadow 0.2s; background: #fff; border-radius: 10px; overflow: hidden; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .product-img { height: 280px; object-fit: cover; width: 100%; }
        .btn-fashion { background-color: #ff3f6c; color: white; font-weight: 600; border: none; }
        .btn-fashion:hover { background-color: #e6355d; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand fs-3" href="{% url 'index' %}">VOGUE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-bold">
                <li class="nav-item"><a class="nav-link text-dark" href="{% url 'index' %}?category=men">MEN</a></li>
                <li class="nav-item"><a class="nav-link text-dark" href="{% url 'index' %}?category=women">WOMEN</a></li>
                <li class="nav-item"><a class="nav-link text-dark" href="{% url 'index' %}?category=kids">KIDS</a></li>
                <li class="nav-item"><a class="nav-link text-dark" href="{% url 'index' %}?category=accessories">ACCESSORIES</a></li>
            </ul>
            <form class="d-flex me-3" method="GET" action="{% url 'index' %}">
                <input class="form-control me-2" type="search" name="q" placeholder="Search clothes...">
            </form>
            <div class="d-flex gap-2 align-items-center">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="btn btn-outline-dark btn-sm"><i class="bi bi-person"></i> Profile</a>
                    <a href="{% url 'cart' %}" class="btn btn-fashion btn-sm"><i class="bi bi-bag"></i> Cart</a>
                    <a href="{% url 'logout' %}" class="btn btn-light btn-sm">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-dark btn-sm">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-fashion btn-sm">Register</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<div class="container my-4">
    {% block content %}{% endblock %}
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
